
<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <!-- Google Analytics 4 — fluxo "App Android" (o site tem fluxo próprio).
         No APK o app roda em https://localhost, onde o cookie do GA não é confiável:
         o identificador do aparelho fica no localStorage e vai como client_id. -->
    <script>
      window.FF_GA_ID = 'G-ECNYYMVYKP';
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      (function () {
        var id = window.FF_GA_ID; if (!id || id.indexOf('G-') !== 0) return;
        var cid; try { cid = localStorage.getItem('ff_ga_cid'); if (!cid) { cid = Math.floor(Math.random() * 1e10) + '.' + Math.floor(Date.now() / 1000); localStorage.setItem('ff_ga_cid', cid); } } catch (e) {}
        gtag('js', new Date());
        gtag('config', id, { client_storage: 'none', client_id: cid, send_page_view: false, app_platform: 'android' });
        var s = document.createElement('script'); s.async = true; s.src = 'https://www.googletagmanager.com/gtag/js?id=' + id; document.head.appendChild(s);
      })();
    </script>
    <meta charset="UTF-8" />
    <!-- [CORREÇÃO] A linha do ícone foi atualizada para usar um ícone PWA existente e corrigir o erro 404 -->
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FocusFrog</title>
    <meta name="description" content="Um aplicativo de produtividade gamificado para mentes criativas.">
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body>
    <div id="root"></div>
    <div id="notification-root"></div>
    <div id="modal-root"></div> 
    <script type="module" src="/src/index.tsx"></script>

    <!-- Script para registar o Service Worker -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(registration => {
            console.log('Service Worker registado com sucesso:', registration);
          }).catch(error => {
            console.log('Falha ao registar o Service Worker:', error);
          });
        });
      }
    </script>
  </body>
</html>
