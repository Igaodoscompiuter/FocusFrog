
<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <!-- Pinta o fundo do tema salvo antes de qualquer JS/CSS, para não piscar o tema padrão. -->
    <script>
      (function () {
        var bg = { 'dark-theme': '#111827', 'light-theme': '#EAF5EC', 'lagoa-theme': '#0B1A1E', 'regia-theme': '#FFF5F7', 'musgo-theme': '#141A12', 'mare-theme': '#0A1628', 'neblina-theme': '#EEF2EF', 'ambar-theme': '#1A1206', 'galaxia-theme': '#0D0B1F' };
        var id = 'dark-theme';
        try { var d = JSON.parse(localStorage.getItem('focusfrog_theme_data_v2') || '{}'); if (d && bg[d.activeThemeId]) id = d.activeThemeId; } catch (e) {}
        document.documentElement.style.backgroundColor = bg[id];
        document.documentElement.style.setProperty('--background-color', bg[id]);
        document.documentElement.setAttribute('data-theme', id);
      })();
    </script>
    <!-- Google Analytics 4 — fluxo "App Android" (o site tem fluxo próprio).
         No APK o app roda em https://localhost, onde o cookie do GA não é confiável:
         o identificador do aparelho fica no localStorage e vai como client_id. -->
    <script>
      window.FF_GA_ID = 'G-ECNYYMVYKP';
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      (function () {
        var id = window.FF_GA_ID; if (!id || id.indexOf('G-') !== 0) return;
        var cid; try { cid = localStorage.getItem('ff_ga_cid'); if (!cid) { cid = Math.floor(Math.random() * 1e10) + '.' + Math.floor(Date.now() / 1000); localStorage.setItem('ff_ga_cid', cid); } } catch (e) {}
        gtag('js', new Date());
        gtag('config', id, { client_storage: 'none', client_id: cid, send_page_view: false, app_platform: 'android' });
        var s = document.createElement('script'); s.async = true; s.src = 'https://www.googletagmanager.com/gtag/js?id=' + id; document.head.appendChild(s);
      })();
    </script>
    <meta charset="UTF-8" />
    <!-- [CORREÇÃO] A linha do ícone foi atualizada para usar um ícone PWA existente e corrigir o erro 404 -->
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FocusFrog</title>
    <meta name="description" content="Um aplicativo de produtividade gamificado para mentes criativas.">
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body>
    <div id="root"></div>
    <div id="notification-root"></div>
    <div id="modal-root"></div> 
    <script type="module" src="/src/main.tsx"></script>

    <!-- O service worker é registrado em src/main.tsx, só na web (não no app Android). -->
  </body>
</html>
