<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta name="robots" content="noindex">
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Lago Zen — v3</title>
<style>
  :root {
    --water-deep: #0a3733;
    --water-mid: #114f49;
    --water-shallow: #1b7568;
    --water-shine: rgba(255,255,255,0.10);
    --panel-bg: #16211e;
    --panel-border: #24352f;
    --text-1: #eef5f1;
    --text-2: #9db8ac;
    --accent: #FBBF24;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%; margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #0a0f0e;
    color: var(--text-1);
  }
  :root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }

  .page { max-width: 480px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .header { display: flex; align-items: baseline; justify-content: space-between; }
  .header h1 { font-size: 18px; font-weight: 600; margin: 0; }
  .header .count { font-size: 13px; color: var(--text-2); }

  .pond-frame {
    position: relative; width: 100%; aspect-ratio: 3 / 4;
    border-radius: 24px; overflow: hidden;
    background: radial-gradient(120% 90% at 30% 15%, var(--water-shallow) 0%, var(--water-mid) 45%, var(--water-deep) 100%);
    box-shadow: inset 0 0 60px rgba(0,0,0,0.45), 0 8px 30px rgba(0,0,0,0.35);
  }

  /* ---------- Água: brilho, ondas e profundidade ---------- */
  .shine {
    position: absolute; inset: -20%;
    background:
      radial-gradient(35% 18% at 20% 20%, var(--water-shine) 0%, transparent 70%),
      radial-gradient(25% 14% at 70% 55%, var(--water-shine) 0%, transparent 70%),
      radial-gradient(30% 16% at 45% 80%, var(--water-shine) 0%, transparent 70%);
    animation: driftShine 22s ease-in-out infinite alternate;
    pointer-events: none; mix-blend-mode: screen; opacity: .5; z-index: 1;
  }
  @keyframes driftShine { 0% { transform: translate(0,0) rotate(0deg); } 100% { transform: translate(3%, -4%) rotate(6deg); } }

  .wavelines { position: absolute; inset: 0; z-index: 1; pointer-events: none; opacity: .35; }
  .wavelines path { animation: waveDrift 9s ease-in-out infinite; }
  .wavelines path:nth-child(2) { animation-delay: -3s; opacity: .6; }
  .wavelines path:nth-child(3) { animation-delay: -6s; opacity: .4; }
  @keyframes waveDrift {
    0%, 100% { transform: translateX(0) scaleY(1); }
    50%      { transform: translateX(2%) scaleY(1.15); }
  }

  .shore {
    position: absolute; left: 0; right: 0; bottom: 0; height: 14%; z-index: 2;
    background: radial-gradient(80% 100% at 50% 100%, #2c4a35 0%, #1c3323 70%, transparent 100%);
    filter: blur(1px);
  }

  .ambient-ripple {
    position: absolute; z-index: 1; border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.25);
    transform: translate(-50%, -50%) scale(0);
    animation: rippleOut linear forwards;
    pointer-events: none;
  }
  .ripple {
    position: absolute; z-index: 3; border-radius: 50%;
    border: 1.5px solid rgba(255,255,255,0.4);
    transform: translate(-50%, -50%) scale(0);
    animation: rippleOut 1.8s ease-out forwards;
    pointer-events: none;
  }
  @keyframes rippleOut {
    0%   { transform: translate(-50%, -50%) scale(0);  opacity: .6; }
    100% { transform: translate(-50%, -50%) scale(7);   opacity: 0; }
  }

  /* ---------- Reflexo/rastro sob elementos em movimento ---------- */
  .reflection {
    position: absolute; z-index: 1; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(255,255,255,0.18), transparent 75%);
    filter: blur(2px);
    pointer-events: none;
  }

  /* ---------- Nenúfares ---------- */
  .lilypad-wrap { position: absolute; z-index: 2; transform: translate(-50%, -50%); }
  .lilypad-shadow {
    position: absolute; left: 50%; top: 58%; transform: translate(-50%, -50%);
    background: radial-gradient(closest-side, rgba(0,0,0,0.35), transparent 75%);
    filter: blur(3px);
  }
  .lilypad {
    position: relative; animation: bob 6s ease-in-out infinite;
  }
  .lilypad.reacting { animation: padTilt 0.9s ease-out; }
  @keyframes bob {
    0%, 100% { transform: rotate(-2deg) translateY(0); }
    50%      { transform: rotate(2deg) translateY(-3px); }
  }
  @keyframes padTilt {
    0%   { transform: rotate(-2deg) translateY(0) scale(1); }
    25%  { transform: rotate(-9deg) translateY(3px) scale(0.97); }
    55%  { transform: rotate(6deg) translateY(-2px) scale(1.02); }
    100% { transform: rotate(-2deg) translateY(0) scale(1); }
  }

  /* ---------- Sapos ---------- */
  .frog-shadow {
    position: absolute; z-index: 2; transform: translate(-50%, -50%);
    background: radial-gradient(closest-side, rgba(0,0,0,0.4), transparent 75%);
    filter: blur(2px);
    transition: left 1.1s cubic-bezier(.65,-0.15,.3,1.3), top 1.1s cubic-bezier(.65,-0.15,.3,1.3);
  }

  .frog {
    position: absolute; z-index: 4;
    transform: translate(-50%, -100%);
    cursor: pointer;
    transition: left 1.1s cubic-bezier(.65,-0.15,.3,1.3), top 1.1s cubic-bezier(.65,-0.15,.3,1.3);
    filter: drop-shadow(0 3px 3px rgba(0,0,0,0.35));
  }
  .frog svg { display: block; animation: idleBreath 2.6s ease-in-out infinite; transform-origin: 50% 92%; }
  @keyframes idleBreath { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(0.965); } }

  /* Brilho por raridade — atrás do sapo, não faz parte da anatomia animada */
  .rarity-glow {
    position: absolute; left: 50%; top: 45%; transform: translate(-50%, -50%);
    width: 60px; height: 60px; border-radius: 50%; z-index: -1;
    pointer-events: none;
  }
  .glow-rare { background: radial-gradient(closest-side, rgba(79,195,247,0.45), transparent 72%); animation: glowPulse 2.4s ease-in-out infinite; }
  .glow-epic { background: radial-gradient(closest-side, rgba(251,191,36,0.55), transparent 72%); animation: glowPulse 1.8s ease-in-out infinite; }
  @keyframes glowPulse { 0%, 100% { opacity: .55; transform: translate(-50%, -50%) scale(0.9); } 50% { opacity: 1; transform: translate(-50%, -50%) scale(1.15); } }

  /* ---------- Carpas ---------- */
  .koi-reflection { z-index: 1; width: 44px; height: 14px; position: absolute; }
  .koi {
    position: absolute; z-index: 3; width: 50px; height: 26px;
    animation-name: swimPath; animation-timing-function: linear; animation-iteration-count: infinite;
    opacity: .95; filter: drop-shadow(0 2px 3px rgba(0,0,0,0.3));
  }
  .koi svg { display: block; }
  .koi .koi-tail { animation: tailWag 0.85s ease-in-out infinite; transform-origin: 12% 50%; }
  @keyframes tailWag { 0%, 100% { transform: rotate(10deg); } 50% { transform: rotate(-10deg); } }
  @keyframes swimPath { 0% { offset-distance: 0%; } 100% { offset-distance: 100%; } }

  /* ---------- Garça ---------- */


  /* ---------- Vaga-lumes ---------- */
  .firefly {
    position: absolute; z-index: 5; border-radius: 50%; background: var(--accent);
    animation: fireflyBlink ease-in-out infinite;
  }

  @keyframes fireflyBlink { 0%, 100% { opacity: .12; } 50% { opacity: .95; } }

  /* ---------- Carta do sapo (Pokémon/Yu-Gi-Oh style) ---------- */
  .card-backdrop {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(0,0,0,0.55);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; animation: backdropIn .2s ease forwards;
    padding: 24px;
  }
  @keyframes backdropIn { to { opacity: 1; } }

  .frog-card {
    position: relative; width: 100%; max-width: 300px;
    border-radius: 20px; padding: 4px;
    transform: scale(.85) rotateY(90deg); animation: cardReveal .5s cubic-bezier(.2,.8,.3,1.1) forwards;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
  }
  @keyframes cardReveal { to { transform: scale(1) rotateY(0deg); } }

  .card-tier-comum   { background: linear-gradient(160deg, #6b7d6f, #3c473e); }
  .card-tier-rara    { background: linear-gradient(160deg, #4FC3F7, #0d47a1); }
  .card-tier-epica   { background: linear-gradient(160deg, #FFE082, #B45309); }

  .frog-card-inner {
    background: var(--panel-bg); border-radius: 17px; padding: 14px;
    display: flex; flex-direction: column; gap: 10px;
    position: relative; overflow: hidden;
  }
  .card-shine {
    position: absolute; top: -50%; left: -60%; width: 40%; height: 200%;
    background: linear-gradient(120deg, transparent, rgba(255,255,255,0.35), transparent);
    transform: rotate(20deg);
    animation: shineSweep 2.6s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes shineSweep { 0% { left: -60%; } 50%, 100% { left: 140%; } }

  .card-top-row { display: flex; justify-content: space-between; align-items: center; }
  .card-name { font-size: 17px; font-weight: 700; color: var(--text-1); }
  .card-rarity-badge {
    font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em;
    padding: 3px 8px; border-radius: 999px; color: #1b1b1b;
  }
  .badge-comum { background: #8BC34A; }
  .badge-rara  { background: #4FC3F7; }
  .badge-epica { background: linear-gradient(90deg, #FBBF24, #FFE082); animation: badgeGlow 1.6s ease-in-out infinite; }
  @keyframes badgeGlow { 0%,100% { filter: brightness(1); } 50% { filter: brightness(1.35); } }

  .card-portrait {
    position: relative; border-radius: 14px; height: 190px;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(120% 100% at 50% 20%, var(--water-shallow), var(--water-deep));
    overflow: hidden;
  }
  .card-portrait svg { width: 130px; height: 130px; filter: drop-shadow(0 6px 6px rgba(0,0,0,0.4)); }
  .card-portrait-glow {
    position: absolute; inset: 0; pointer-events: none;
  }
  .glow-comum   .card-portrait-glow { background: radial-gradient(closest-side, rgba(139,195,74,0.25), transparent 70%); }
  .glow-rara    .card-portrait-glow { background: radial-gradient(closest-side, rgba(79,195,247,0.4), transparent 70%); animation: glowPulse 2.2s ease-in-out infinite; }
  .glow-epica   .card-portrait-glow { background: radial-gradient(closest-side, rgba(251,191,36,0.5), transparent 70%); animation: glowPulse 1.6s ease-in-out infinite; }

  .card-flavor { font-size: 12.5px; font-style: italic; color: var(--text-2); line-height: 1.4; }

  .card-stats { display: flex; flex-direction: column; gap: 6px; }
  .stat-row { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--text-2); }
  .stat-label { width: 78px; flex-shrink: 0; }
  .stat-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(128,128,128,0.25); overflow: hidden; }
  .stat-fill { display: block; height: 100%; border-radius: 3px; background: var(--accent); animation: fillIn .7s ease forwards; transform-origin: left; }
  @keyframes fillIn { from { transform: scaleX(0); } }

  .card-close {
    position: absolute; top: -14px; right: -14px; width: 32px; height: 32px; border-radius: 50%;
    background: var(--panel-bg); border: 1px solid var(--panel-border); color: var(--text-1);
    font-size: 16px; display: flex; align-items: center; justify-content: center; cursor: pointer;
  }

  .legend { display: flex; gap: 8px; flex-wrap: wrap; font-size: 12px; color: var(--text-2); }
  .legend span { display: inline-flex; align-items: center; gap: 4px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

  /* ================= v3 ================= */
  /* Posição e deformação agora são 100% guiadas por JS (mesmo relógio) —
     transições CSS de left/top faziam o sapo continuar deslizando depois do pouso. */
  .frog { transition: none !important; transform-origin: 50% 100%; }
  .frog-shadow { transition: none !important; }
  .eye-blink { animation: eyeBlink 4.5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes eyeBlink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(0.1); } }

  .header-right { display: flex; align-items: center; gap: 10px; }
  .tools { display: flex; gap: 8px; flex-wrap: wrap; }
  .pill-btn {
    font: inherit; font-size: 12px; font-weight: 600; cursor: pointer;
    background: var(--panel-bg); color: var(--text-1);
    border: 1px solid var(--panel-border); border-radius: 999px; padding: 7px 12px;
  }
  .pill-btn:active { transform: scale(.97); }
  .pill-btn:disabled { opacity: .5; cursor: not-allowed; }
  .card-actions { display: flex; justify-content: center; margin-top: 2px; }
  .card-action-btn { width: 100%; padding: 10px 12px; font-size: 13px; }

  /* efeitos de fusão */
  .ring-gold { border-color: rgba(251,191,36,0.85); border-width: 2px; }
  .spark {
    position: absolute; z-index: 6; width: 5px; height: 5px; border-radius: 50%;
    background: var(--accent); box-shadow: 0 0 6px 1px var(--accent);
    transform: translate(-50%, -50%); animation: sparkOut .65s ease-out forwards; pointer-events: none;
  }
  @keyframes sparkOut {
    from { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    to   { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(.2); opacity: 0; }
  }
  .float-text {
    position: absolute; z-index: 7; transform: translate(-50%, -50%);
    font-size: 14px; font-weight: 800; color: var(--accent); text-shadow: 0 1px 4px rgba(0,0,0,0.6);
    animation: floatUp 1s ease-out forwards; pointer-events: none;
  }
  @keyframes floatUp {
    from { opacity: 0; transform: translate(-50%, -30%) scale(.7); }
    20%  { opacity: 1; transform: translate(-50%, -60%) scale(1.15); }
    to   { opacity: 0; transform: translate(-50%, -160%) scale(1); }
  }

  .toast {
    position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
    background: var(--panel-bg); color: var(--text-1); border: 1px solid var(--panel-border);
    padding: 10px 16px; border-radius: 999px; font-size: 13px; z-index: 60;
    box-shadow: 0 8px 24px rgba(0,0,0,.4); animation: toastIn .25s ease;
  }
  @keyframes toastIn { from { opacity: 0; transform: translate(-50%, 10px); } }

  /* viveiro (bottom sheet) */
  .sheet-backdrop {
    position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.55);
    display: flex; align-items: flex-end; justify-content: center; animation: backdropIn .2s ease forwards;
  }
  .sheet {
    width: 100%; max-width: 480px; max-height: 82vh; overflow-y: auto;
    background: var(--panel-bg); border-radius: 22px 22px 0 0; padding: 16px 16px calc(20px + env(safe-area-inset-bottom, 0px));
    animation: sheetUp .3s cubic-bezier(.2,.8,.3,1);
  }
  @keyframes sheetUp { from { transform: translateY(40px); opacity: 0; } }
  .sheet-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .sheet-title { font-size: 17px; font-weight: 700; color: var(--text-1); }
  .sheet-sub { font-size: 12px; color: var(--text-2); margin-top: 2px; }
  .sheet-section { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--text-2); margin: 14px 0 8px; }
  .sheet-empty { font-size: 13px; color: var(--text-2); padding: 8px 0; }
  .sheet-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .mini { border-radius: 14px; padding: 8px 6px 8px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 4px; border: 1px solid var(--panel-border); }
  .mini-comum { background: rgba(139,195,74,.08); }
  .mini-rara  { background: rgba(79,195,247,.12); border-color: rgba(79,195,247,.4); }
  .mini-epica { background: rgba(251,191,36,.14); border-color: rgba(251,191,36,.55); }
  .mini-pic { cursor: pointer; height: 46px; }
  .mini-name { font-size: 11px; color: var(--text-1); line-height: 1.2; min-height: 26px; display: flex; align-items: center; }
  .mini-btn { font: inherit; font-size: 11px; font-weight: 600; cursor: pointer; border-radius: 999px; padding: 4px 10px; border: 1px solid var(--panel-border); background: transparent; color: var(--text-1); }
</style>
<style>
.header,.legend,.tools,.sheet-backdrop,.toast,.card-backdrop{display:none!important}
html,body{height:100%!important;margin:0!important;background:#0a3733!important;overflow:hidden!important;pointer-events:none!important}
.page{max-width:none!important;padding:0!important;gap:0!important;height:100%!important;display:block!important}
.pond-frame{border-radius:0!important;box-shadow:none!important;aspect-ratio:auto!important;height:100%!important}
</style>
</head>
<body>
<div class="page">
  <div class="header">
    <h1>🐸 Lago Zen</h1>
    <div class="header-right">
      <span class="count" id="countLabel">Lagoa 0/8</span>
      <button class="pill-btn" id="btnStorage">🧺 Viveiro <b id="storageCount">0</b></button>
    </div>
  </div>

  <div class="pond-frame" id="pond">
    <div class="shine"></div>
    <svg class="wavelines" viewBox="0 0 380 500" preserveAspectRatio="none">
      <path d="M0 120 Q95 108 190 120 T380 120" stroke="rgba(255,255,255,0.5)" stroke-width="1.5" fill="none"/>
      <path d="M0 260 Q95 248 190 260 T380 260" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" fill="none"/>
      <path d="M0 380 Q95 368 190 380 T380 380" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" fill="none"/>
    </svg>
    <div class="shore"></div>
  </div>

  <div class="legend">
    <span><i class="dot" style="background:#8BC34A"></i>Comum</span>
    <span><i class="dot" style="background:#4FC3F7"></i>Rara</span>
    <span><i class="dot" style="background:#FBBF24"></i>Épica</span>
  </div>
  <div class="tools">
    <button class="pill-btn" id="btnCollect">＋ Coletar sapo (teste)</button>
    <button class="pill-btn" id="btnSpeed">Velocidade 4×</button>
  </div>
</div>

<script>
(function () {
  const pond = document.getElementById('pond');
  const countLabel = document.getElementById('countLabel');
  const storageCountEl = document.getElementById('storageCount');

  /* ============================================================
     SAPO — RIG COM GRUPOS CONECTADOS + LINHA DO TEMPO DO PULO

     Por que mudou: antes cada elipse interpolava sozinha entre 4
     poses, então pernas e corpo se afastavam ("partes descolando").
     Agora a anatomia (idêntica ao ZenFrog.tsx) fica FIXA e o corpo
     inteiro deforma junto via UM transform ancorado nos pés. Só
     pernas e olhos têm movimento secundário, sempre presos ao corpo.

     A linha do tempo segue os princípios de animação de jogos:
       1. Antecipação  — agacha (squash) antes de sair do chão
       2. Voo          — arco PARABÓLICO real (hang time no ápice),
                         esticando conforme a velocidade (stretch)
       3. Pouso        — squash de impacto + mola amortecida
                         (follow-through), pupilas/pernas com atraso
     ============================================================ */
  const svgNS = 'http://www.w3.org/2000/svg';
  const lerp = (a, b, t) => a + (b - a) * t;
  const easeOutQuad = (t) => 1 - (1 - t) * (1 - t);
  const clampN = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

  // Anatomia idêntica ao ZenFrog.tsx do app (elipses + olhos + boca).
  const FROG_ANATOMY = {
    legBack:  [[28, 75, 12, 10], [72, 75, 12, 10]],
    body:     [50, 60, 30, 25],
    belly:    [50, 65, 20, 18],
    legFront: [[38, 80, 8, 6], [62, 80, 8, 6]],
    eyes:     [[40, 45], [60, 45]],
    eyeR: 10, pupilR: 5,
    mouth: 'M45,68 Q50,72 55,68',
  };
  const GROUND_Y = 86;  // linha do chão dentro do viewBox
  const PIVOT_X = 50;

  function buildFrogRig(species) {
    const A = FROG_ANATOMY;
    const svg = document.createElementNS(svgNS, 'svg');
    svg.setAttribute('width', '52');
    svg.setAttribute('height', '52');
    svg.setAttribute('viewBox', '0 0 100 100');
    svg.style.overflow = 'visible';

    const mk = (tag, attrs, parent) => {
      const el = document.createElementNS(svgNS, tag);
      for (const k in attrs) el.setAttribute(k, attrs[k]);
      (parent || svg).appendChild(el);
      return el;
    };
    const legAttrs = (l) => ({ cx: l[0], cy: l[1], rx: l[2], ry: l[3], fill: species.body, stroke: 'rgba(0,0,0,0.25)', 'stroke-width': '1.5' });

    const root = mk('g', {});
    const legBackG = A.legBack.map((l) => { const g = mk('g', {}, root); mk('ellipse', legAttrs(l), g); return g; });
    mk('ellipse', { cx: A.body[0], cy: A.body[1], rx: A.body[2], ry: A.body[3], fill: species.body }, root);
    mk('ellipse', { cx: A.belly[0], cy: A.belly[1], rx: A.belly[2], ry: A.belly[3], fill: species.belly, opacity: '0.8' }, root);
    const legFrontG = A.legFront.map((l) => { const g = mk('g', {}, root); mk('ellipse', legAttrs(l), g); return g; });

    const blinkDelay = (-Math.random() * 4).toFixed(2) + 's';
    const eyes = A.eyes.map((e) => {
      const g = mk('g', {}, root);
      const blink = mk('g', { 'class': 'eye-blink' }, g);
      blink.style.animationDelay = blinkDelay;
      mk('circle', { cx: e[0], cy: e[1], r: A.eyeR, fill: '#ffffff' }, blink);
      const pupil = mk('circle', { cx: e[0], cy: e[1], r: A.pupilR, fill: '#1b1b1b' }, blink);
      return { g: g, pupil: pupil, cx: e[0], cy: e[1] };
    });
    mk('path', { d: A.mouth, stroke: species.belly, 'stroke-width': '2', fill: 'none', 'stroke-linecap': 'round' }, root);

    /** p: sx, sy (deformação do corpo), tilt (graus), legBackStretch/legBackSplay,
     *  legFrontTuck, pupilLag (-1..1), squint (0..1). Tudo opcional. */
    function set(p) {
      p = p || {};
      const sx = p.sx == null ? 1 : p.sx;
      const sy = p.sy == null ? 1 : p.sy;
      root.setAttribute('transform',
        'translate(' + PIVOT_X + ' ' + GROUND_Y + ') rotate(' + (p.tilt || 0) + ') scale(' + sx + ' ' + sy + ') translate(' + (-PIVOT_X) + ' ' + (-GROUND_Y) + ')');

      legBackG.forEach((g, i) => {
        const l = A.legBack[i], dir = i === 0 ? -1 : 1, topY = l[1] - l[3];
        const s2 = 1 + 0.55 * (p.legBackStretch || 0);
        g.setAttribute('transform',
          'translate(' + (dir * (p.legBackSplay || 0)) + ' 0) translate(' + l[0] + ' ' + topY + ') scale(1 ' + s2 + ') translate(' + (-l[0]) + ' ' + (-topY) + ')');
      });
      legFrontG.forEach((g, i) => {
        const l = A.legFront[i], topY = l[1] - l[3], tuck = p.legFrontTuck || 0;
        g.setAttribute('transform',
          'translate(0 ' + (-3 * tuck) + ') translate(' + l[0] + ' ' + topY + ') scale(1 ' + (1 - 0.3 * tuck) + ') translate(' + (-l[0]) + ' ' + (-topY) + ')');
      });
      eyes.forEach((e) => {
        e.pupil.setAttribute('transform', 'translate(0 ' + ((p.pupilLag || 0) * 2.2) + ')');
        e.g.setAttribute('transform',
          'translate(' + e.cx + ' ' + e.cy + ') scale(1 ' + (1 - 0.55 * (p.squint || 0)) + ') translate(' + (-e.cx) + ' ' + (-e.cy) + ')');
      });
    }
    set({});
    return { svg: svg, set: set };
  }

  // Fases (fração do tempo total): antecipação [0,a] · voo [a,b] · pouso [b,1]
  const HOP_PHASE = { a: 0.17, b: 0.68 };

  /** Devolve, para o instante t (0..1) do pulo, todos os parâmetros do rig.
   *  h = altura normalizada (0..1), p = progresso horizontal (0..1). */
  function hopFrame(t, mode) {
    const drop = mode === 'drop';
    const a = drop ? 0 : HOP_PHASE.a;
    const b = drop ? 0.55 : HOP_PHASE.b;
    const f = { sx: 1, sy: 1, h: 0, p: 0, tilt: 0, lbs: 0, lsp: 0, lft: 0, lag: 0, sq: 0, osc: 0, sink: 0, phase: 'anticipation' };

    if (t < a) { // 1) ANTECIPAÇÃO — agacha juntando energia
      const s = easeOutQuad(t / a);
      f.sx = 1 + 0.16 * s; f.sy = 1 - 0.20 * s;
      f.sink = 2 * s; f.lsp = 3 * s; f.lag = 0.6 * s;
      return f;
    }

    if (t < b) { // 2) VOO — arco parabólico, stretch pela velocidade
      f.phase = 'flight';
      const u = (t - a) / (b - a);
      const k = Math.abs(1 - 2 * u);                  // 1 nas pontas, 0 no ápice
      const sxT = drop ? 1 - 0.10 * u : 1.03 - 0.15 * k;
      const syT = drop ? 1 + 0.22 * u : 0.97 + 0.25 * k;
      const w = drop ? 1 : easeOutQuad(Math.min(1, u / 0.2)); // sai suave da antecipação
      f.sx = lerp(1.16, sxT, w);
      f.sy = lerp(0.80, syT, w);
      f.h = drop ? 1 - u * u : 4 * u * (1 - u);
      f.p = drop ? 1 : u;
      f.tilt = drop ? 0 : Math.sin(Math.PI * u);      // fator; multiplicado pela direção
      // membros também "herdam" a pose da antecipação e se soltam suavemente (sem tranco)
      f.lbs = lerp(0, 0.3 + 0.7 * k, w);              // pernas se esticam subindo/descendo
      f.lft = lerp(0, 1 - 0.6 * k, w);                // patinhas da frente recolhem no ápice
      f.lsp = lerp(3, 0, w);
      f.lag = lerp(0.6, (1 - 2 * u) * 0.9, w);        // pupilas ficam pra trás (overlapping)
      return f;
    }

    // 3) POUSO — squash de impacto + mola amortecida (follow-through)
    f.phase = 'landing';
    const w = (t - b) / (1 - b);
    const osc = Math.exp(-3.4 * w) * Math.cos(2 * Math.PI * 1.1 * w);
    const q = easeOutQuad(Math.min(1, w / 0.1));      // encaixa no fim do voo
    const endSx = drop ? 0.90 : 0.88, endSy = 1.22;
    f.sx = lerp(endSx, 1 + 0.22 * osc, q);
    f.sy = lerp(endSy, 1 - 0.26 * osc, q);
    f.p = 1;
    f.lbs = 1 - q; f.lft = (1 - q) * 0.4;
    f.lsp = 4 * Math.max(0, osc);
    f.lag = lerp(-0.9, -0.7 * osc, q);
    f.sq = Math.max(0, osc);
    f.osc = osc;
    return f;
  }

  /* ============================================================
     NENÚFAR — folha orgânica com recorte (V), nervuras e realce
     de luz. Três variações de contorno para não repetir a mesma
     silhueta em todos os nenúfares.
     ============================================================ */
  function lilyPadSVG(tint, tintLight, variant) {

      "M50 6 C74 6 92 16 94 42 C96 66 82 92 56 94 C30 96 8 78 6 52 C4 28 26 6 50 6 Z",

      "M48 6 C70 8 90 24 90 48 C90 72 70 92 46 92 C22 92 6 74 8 50 C10 26 28 4 48 6 Z",
    ];
    const outline = outlines[variant % outlines.length];
    return `<svg width="1" height="1" viewBox="0 0 100 100" style="overflow:visible">
      <!-- corte em V apontando para fora, estilo nenúfar de verdade -->
      <path d="${outline}" fill="${tint}" stroke="#00000022" stroke-width="1"/>
      <path d="M50 50 L92 42 L86 52 L92 62 Z" fill="var(--water-mid)"/>
      <ellipse cx="42" cy="40" rx="24" ry="18" fill="${tintLight}" opacity="0.35"/>

  }

     CARPA — corpo afunilado, nadadeiras translúcidas, cauda

  /* ============================================================

  const LILYPADS = [

  /* ============================================================
     POPULAÇÃO, FUSÃO E VIVEIRO

     - Sapos boiam livres (sem vaga fixa), cada espécie pula com a
       "personalidade" do frogPersonalities.ts real.
     - ATRAÇÃO ATIVA: 70% dos pulos vão em direção ao sapo mais
       próximo da MESMA espécie (validado em simulação: converge em
       ~3 min numa lagoa de 8, vs ~60 min só por esbarrão aleatório).
     - Colisão só bloqueia espécies DIFERENTES; da mesma espécie eles
       podem se aproximar — e ao chegar perto, FUNDEM.
     - Teto de MAX_POND sapos na lagoa; o resto fica no VIVEIRO.
     ============================================================ */
  const MAX_POND = 8;
  let SPEED = 4; // aceleração só do teste; no app real seria 1
  const PERSONALITIES = {
    SUNNY:      { moveInterval: [3000, 7000],    jumpDistance: [5, 15] },
    OCEAN:      { moveInterval: [6000, 12000],   jumpDistance: [50, 80] },
    JUNGLE:     { moveInterval: [10000, 20000],  jumpDistance: [20, 40] },
    STRAWBERRY: { moveInterval: [15000, 25000],  jumpDistance: [2, 8] },
    GHOST:      { moveInterval: [60000, 120000], jumpDistance: [10, 20] },
    GALAXY:     { moveInterval: [30000, 50000],  jumpDistance: [70, 90] },
  };
  const POND_BOUNDS = { left: 12, right: 88, top: 15, bottom: 82 };
  const COLLISION_RADIUS = 7;       // só contra espécies DIFERENTES
  const INTERACTION_DISTANCE = 8;   // fusão (mesma espécie)
  const ATTRACTION_CHANCE = 0.7;
  const TICK_MS = 500;

  const randBetween = (min, max) => Math.random() * (max - min) + min;
  const dist = (a, b) => Math.hypot(a.left - b.left, a.top - b.top);
  const rarityKey = (sp) => (sp.rarity === 'Épica' ? 'epica' : (sp.rarity === 'Rara' ? 'rara' : 'comum'));
  const rarityRank = (sp) => ({ epica: 0, rara: 1, comum: 2 })[rarityKey(sp)];

  let simTime = 0;
  let nextId = 1;
  let collection = [];
  const pondList = () => collection.filter((f) => f.location === 'pond' && !f.merging);
  const storageList = () => collection.filter((f) => f.location === 'storage');

  function newFrog(species, location) {
    return {
      id: 'f' + (nextId++), species: species, left: 50, top: 50, scale: 0.55, count: 1,
      moveAt: simTime + randBetween(1500, 5000), location: location,
      el: null, shadowEl: null, rig: null,
      hopping: false, pulsing: false, pendingPulse: false, merging: false,
    };
  }

  function pickFreeSpot() {
    const others = pondList();
    let best = null, bestScore = -1;
    for (let i = 0; i < 14; i++) {
      const c = { left: randBetween(POND_BOUNDS.left, POND_BOUNDS.right), top: randBetween(POND_BOUNDS.top, POND_BOUNDS.bottom) };
      const s = others.length ? Math.min.apply(null, others.map((o) => dist(c, o))) : 99;
      if (s > bestScore) { bestScore = s; best = c; }
    }
    return best;
  }

  /* ---------- montagem no DOM ---------- */
  function mountFrog(frog) {
    const shadow = document.createElement('div');
    shadow.className = 'frog-shadow';
    shadow.style.width = '26px';
    shadow.style.height = '10px';
    pond.appendChild(shadow);

    const el = document.createElement('div');
    el.className = 'frog';
    const rig = buildFrogRig(frog.species);
    el.appendChild(rig.svg);

    if (frog.species.rarity !== 'Comum') {
      const glow = document.createElement('div');
      glow.className = 'rarity-glow ' + (frog.species.rarity === 'Épica' ? 'glow-epic' : 'glow-rare');
      el.appendChild(glow);
    }
    pond.appendChild(el);

    frog.el = el; frog.shadowEl = shadow; frog.rig = rig;
    el.addEventListener('click', () => showCard(frog));
    placeFrog(frog, 0);
  }

  function applyOuter(frog, liftPx) {
    frog.el.style.transform = 'translate(-50%, -100%) translateY(' + (-liftPx) + 'px) scale(' + frog.scale + ')';
    frog.shadowEl.style.transform = 'translate(-50%, -50%) translateY(-5px) scale(' + frog.scale + ')';
  }
  function placeFrog(frog, liftPx) {
    frog.el.style.left = frog.left + '%';
    frog.el.style.top = frog.top + '%';
    frog.shadowEl.style.left = frog.left + '%';
    frog.shadowEl.style.top = frog.top + '%';
    applyOuter(frog, liftPx || 0);
  }

  /* ---------- o PULO: parábola + posição no MESMO relógio ---------- */
  function animateHop(frog, target, opts) {
    const mode = (opts && opts.mode) || 'hop';
    const from = { left: frog.left, top: frog.top };
    const d = Math.hypot(target.left - from.left, target.top - from.top);
    const H = mode === 'drop' ? 64 : Math.min(48, 16 + d * 2.2);       // altura em px
    const D = mode === 'drop' ? 780 : 640 + d * 14;                     // duração em ms
    const dirX = Math.sign(target.left - from.left) || 1;
    const landAt = mode === 'drop' ? 0.55 : HOP_PHASE.b;
    frog.hopping = true;
    let rippled = false;
    const start = performance.now();

    function step(now) {
      if (frog.location !== 'pond' || !frog.el) { frog.hopping = false; return; }
      const t = Math.min(1, (now - start) / D);
      const f = hopFrame(t, mode);

      // posição horizontal só avança durante o voo (sincronizada com a parábola)
      frog.left = mode === 'drop' ? target.left : lerp(from.left, target.left, f.p);
      frog.top = mode === 'drop' ? target.top : lerp(from.top, target.top, f.p);
      placeFrog(frog, H * f.h - f.sink);

      frog.rig.set({
        sx: f.sx, sy: f.sy, tilt: f.tilt * dirX * 7,
        legBackStretch: f.lbs, legBackSplay: f.lsp, legFrontTuck: f.lft,
        pupilLag: f.lag, squint: f.sq,
      });

      // sombra fica no chão: encolhe/clareia com a altura, alarga no impacto
      const shadowW = 1 - 0.35 * f.h + 0.15 * Math.max(0, f.osc);
      frog.shadowEl.style.transform = 'translate(-50%, -50%) translateY(-5px) scale(' + (frog.scale * shadowW) + ')';
      frog.shadowEl.style.opacity = String(0.9 - 0.5 * f.h);
      if (mode === 'drop') frog.el.style.opacity = String(Math.min(1, t / 0.18));

      if (!rippled && t >= landAt) { rippled = true; spawnRipple({ x: frog.left, y: frog.top }); }

      if (t < 1) {
        requestAnimationFrame(step);
      } else {
        frog.hopping = false;
        frog.rig.set({});
        frog.left = target.left; frog.top = target.top;
        placeFrog(frog, 0);
        frog.shadowEl.style.opacity = '';
        frog.el.style.opacity = '';
        if (frog.pendingPulse) { frog.pendingPulse = false; playPulse(frog); }
      }
    }
    requestAnimationFrame(step);
  }

  /* ---------- efeitos de fusão ---------- */
  function setScaleSmooth(frog, target, dur) {
    const from = frog.scale, start = performance.now();
    const c1 = 1.70158, c3 = c1 + 1;
    (function step(now) {
      const w = Math.min(1, (now - start) / dur);
      const e = 1 + c3 * Math.pow(w - 1, 3) + c1 * Math.pow(w - 1, 2); // easeOutBack
      frog.scale = lerp(from, target, e);
      if (frog.el && !frog.hopping) applyOuter(frog, 0);
      if (w < 1) requestAnimationFrame(step);
    })(start);
  }

  function playPulse(frog) {
    if (frog.hopping) { frog.pendingPulse = true; return; }
    frog.pulsing = true;
    const dur = 560, start = performance.now();
    (function step(now) {
      if (!frog.el || frog.hopping) { frog.pulsing = false; return; }
      const w = Math.min(1, (now - start) / dur);
      const o = Math.exp(-3 * w) * Math.sin(2 * Math.PI * 1.6 * w);
      frog.rig.set({ sx: 1 - 0.20 * o, sy: 1 + 0.22 * o, squint: Math.max(0, -o) * 0.8 });
      if (w < 1) requestAnimationFrame(step); else { frog.rig.set({}); frog.pulsing = false; }
    })(start);
  }

  function burst(frog) {
    const ring = document.createElement('div');
    ring.className = 'ripple ring-gold';
    ring.style.left = frog.left + '%'; ring.style.top = frog.top + '%';
    ring.style.width = '12px'; ring.style.height = '12px';
    pond.appendChild(ring);
    setTimeout(() => ring.remove(), 1900);
    for (let i = 0; i < 8; i++) {
      const s = document.createElement('div');
      s.className = 'spark';
      const ang = (i / 8) * Math.PI * 2 + randBetween(-0.2, 0.2), r = randBetween(24, 44);
      s.style.left = frog.left + '%'; s.style.top = (frog.top - 4) + '%';
      s.style.setProperty('--dx', Math.cos(ang) * r + 'px');
      s.style.setProperty('--dy', Math.sin(ang) * r + 'px');
      pond.appendChild(s);
      setTimeout(() => s.remove(), 700);
    }
  }

  function floatText(frog, text) {
    const t = document.createElement('div');
    t.className = 'float-text';
    t.textContent = text;
    t.style.left = frog.left + '%'; t.style.top = (frog.top - 8) + '%';
    pond.appendChild(t);
    setTimeout(() => t.remove(), 1000);
  }

  /** Fusão fluida: o sapo "engolido" desliza até o outro em arco,
   *  girando e encolhendo; só então o sobrevivente cresce com mola,
   *  pulsa, solta faíscas e mostra "+N". */
  function mergeInto(keep, gone) {
    gone.merging = true;
    const from = { left: gone.left, top: gone.top };
    const dur = 560, start = performance.now(), s0 = gone.scale;
    (function step(now) {
      if (!gone.el) return;
      const w = Math.min(1, (now - start) / dur);
      const e = w * w;                                   // acelera ao chegar
      gone.left = lerp(from.left, keep.left, e);
      gone.top = lerp(from.top, keep.top, e);
      gone.el.style.left = gone.left + '%'; gone.el.style.top = gone.top + '%';
      gone.shadowEl.style.left = gone.left + '%'; gone.shadowEl.style.top = gone.top + '%';
      const arc = Math.sin(Math.PI * w) * 16;
      const s = s0 * (1 - 0.7 * e);
      gone.el.style.transform = 'translate(-50%, -100%) translateY(' + (-arc) + 'px) scale(' + s + ')';
      gone.shadowEl.style.transform = 'translate(-50%, -50%) translateY(-5px) scale(' + s + ')';
      const op = String(1 - Math.max(0, (w - 0.55) / 0.45));
      gone.el.style.opacity = op; gone.shadowEl.style.opacity = op;
      gone.rig.set({ sx: 1 - 0.1 * w, sy: 1 + 0.12 * w, tilt: w * 220, legBackStretch: 0.6 * w });
      if (w < 1) { requestAnimationFrame(step); return; }

      gone.el.remove(); gone.shadowEl.remove();
      collection = collection.filter((f) => f !== gone);
      keep.count += gone.count;
      setScaleSmooth(keep, Math.min(2.0, keep.scale * 1.12), 560);
      playPulse(keep); burst(keep); floatText(keep, '+' + gone.count);
      updateUI();
    })(start);
  }

  /* ---------- viveiro: guardar / soltar / coletar ---------- */
  function sendToStorage(frog) {
    if (frog.location !== 'pond' || !frog.el) return;
    frog.location = 'storage';
    const el = frog.el, sh = frog.shadowEl;
    el.style.transition = 'opacity .3s ease, transform .3s ease';
    el.style.opacity = '0';
    el.style.transform = el.style.transform + ' scale(0.3)';
    sh.style.transition = 'opacity .3s ease';
    sh.style.opacity = '0';
    burst(frog);
    setTimeout(() => { el.remove(); sh.remove(); }, 320);
    frog.el = null; frog.shadowEl = null; frog.hopping = false;
    updateUI();
  }

  function releaseToPond(frog) {
    if (frog.location !== 'storage') return false;
    if (pondList().length >= MAX_POND) { showToast('A lagoa está cheia (' + MAX_POND + '/' + MAX_POND + ')'); return false; }
    const spot = pickFreeSpot();
    frog.location = 'pond';
    frog.left = spot.left; frog.top = spot.top;
    frog.moveAt = simTime + randBetween(2500, 6000);
    mountFrog(frog);
    frog.el.style.opacity = '0';
    animateHop(frog, spot, { mode: 'drop' });
    updateUI();
    return true;
  }

  function collectNewFrog() {
    const r = Math.random();
    const tier = r < 0.70 ? 'Comum' : (r < 0.92 ? 'Rara' : 'Épica');
    const pool = SPECIES.filter((s) => s.rarity === tier);
    const species = pool[Math.floor(Math.random() * pool.length)];
    const frog = newFrog(species, 'storage');
    collection.push(frog);
    if (pondList().length < MAX_POND) {
      releaseToPond(frog);
      showToast('Novo sapo: ' + species.name + '!');
    } else {
      showToast('Lagoa cheia — ' + species.name + ' foi para o viveiro');
    }
    updateUI();
  }

  /* ---------- coleção inicial simulada (semanas de jogo) ---------- */
  (function initCollection() {
    const weights = [['Sapo da Selva', 6], ['Sapo Solar', 5], ['Sapo Oceânico', 5], ['Sapo Morango', 3], ['Sapo Fantasma', 2], ['Sapo Galáxia', 1]];
    weights.forEach((w) => {
      const sp = SPECIES.find((s) => s.name === w[0]);
      for (let i = 0; i < w[1]; i++) collection.push(newFrog(sp, 'storage'));
    });
    // Lagoa inicial: um de cada espécie e completa com duplicatas até o teto.
    const chosen = [];
    SPECIES.forEach((sp) => { const f = collection.find((x) => x.species === sp); if (f && chosen.length < MAX_POND) chosen.push(f); });
    collection.forEach((f) => { if (chosen.length < MAX_POND && chosen.indexOf(f) < 0) chosen.push(f); });
    chosen.forEach((f) => {
      f.location = 'pond';
      const spot = pickFreeSpot();
      f.left = spot.left; f.top = spot.top;
      mountFrog(f);
    });
  })();

  /* ---------- tick da simulação ---------- */
  function simulationTick() {
    simTime += TICK_MS * SPEED;
    const inPond = pondList();

    inPond.forEach((frog) => {
      if (frog.hopping || frog.pulsing || simTime < frog.moveAt) return;
      const p = PERSONALITIES[frog.species.key] || PERSONALITIES.JUNGLE;
      let angle = randBetween(0, Math.PI * 2);
      let d = randBetween(p.jumpDistance[0], p.jumpDistance[1]) / 5;

      if (Math.random() < ATTRACTION_CHANCE) { // atração ativa pelo parceiro mais próximo
        let partner = null, pd = Infinity;
        inPond.forEach((o) => {
          if (o !== frog && o.species.key === frog.species.key) { const dd = dist(frog, o); if (dd < pd) { pd = dd; partner = o; } }
        });
        if (partner) {
          angle = Math.atan2(partner.top - frog.top, partner.left - frog.left) + randBetween(-0.35, 0.35);
          d = Math.min(d, Math.max(pd - 1, 0.5));
        }
      }
      const target = {
        left: clampN(frog.left + Math.cos(angle) * d, POND_BOUNDS.left, POND_BOUNDS.right),
        top: clampN(frog.top + Math.sin(angle) * d, POND_BOUNDS.top, POND_BOUNDS.bottom),
      };
      const blocked = inPond.some((o) => o !== frog && o.species.key !== frog.species.key && dist(target, o) < COLLISION_RADIUS);
      if (blocked) { frog.moveAt = simTime + randBetween(2000, 4000); return; }
      frog.moveAt = simTime + randBetween(p.moveInterval[0], p.moveInterval[1]);
      animateHop(frog, target);
    });

    const live = pondList();
    for (let i = 0; i < live.length; i++) {
      for (let j = i + 1; j < live.length; j++) {
        const a = live[i], b = live[j];
        if (a.merging || b.merging || a.hopping || b.hopping) continue;
        if (a.species.key === b.species.key && dist(a, b) < INTERACTION_DISTANCE) {
          if (a.scale >= b.scale) mergeInto(a, b); else mergeInto(b, a);
        }
      }
    }
  }
  setInterval(simulationTick, TICK_MS);

  /* ---------- UI: contador, toast, viveiro, carta ---------- */
  function updateUI() {
    countLabel.textContent = 'Lagoa ' + pondList().length + '/' + MAX_POND;
    storageCountEl.textContent = storageList().length;
    renderSheet();
  }

  function showToast(msg) {
    const t = document.createElement('div');
    t.className = 'toast';
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 2400);
  }

  function spawnRipple(pos) {
    const r = document.createElement('div');
    r.className = 'ripple';
    r.style.left = pos.x + '%';
    r.style.top = pos.y + '%';
    r.style.width = '10px';
    r.style.height = '10px';
    pond.appendChild(r);
    setTimeout(() => r.remove(), 1900);
  }

  let sheetEl = null;
  function openSheet() {
    if (sheetEl) return;
    sheetEl = document.createElement('div');
    sheetEl.className = 'sheet-backdrop';
    sheetEl.addEventListener('click', (e) => { if (e.target === sheetEl) closeSheet(); });
    const sheet = document.createElement('div');
    sheet.className = 'sheet';
    sheetEl.appendChild(sheet);
    document.body.appendChild(sheetEl);
    renderSheet();
  }
  function closeSheet() { if (sheetEl) { sheetEl.remove(); sheetEl = null; } }

  function miniCard(f) {
    const rk = rarityKey(f.species);
    const tile = document.createElement('div');
    tile.className = 'mini mini-' + rk;
    const pic = document.createElement('div');
    pic.className = 'mini-pic';
    const rig = buildFrogRig(f.species);
    rig.svg.setAttribute('width', '46');
    rig.svg.setAttribute('height', '46');
    pic.appendChild(rig.svg);
    pic.addEventListener('click', () => showCard(f));
    const name = document.createElement('div');
    name.className = 'mini-name';
    name.textContent = f.species.name + (f.count > 1 ? ' ×' + f.count : '');
    const btn = document.createElement('button');
    btn.className = 'mini-btn';
    btn.textContent = f.location === 'pond' ? 'Guardar' : 'Soltar';
    btn.addEventListener('click', (e) => { e.stopPropagation(); if (f.location === 'pond') sendToStorage(f); else releaseToPond(f); });
    tile.appendChild(pic); tile.appendChild(name); tile.appendChild(btn);
    return tile;
  }

  function renderSheet() {
    if (!sheetEl) return;
    const sheet = sheetEl.firstChild;
    sheet.innerHTML = '';
    const header = document.createElement('div');
    header.className = 'sheet-header';
    header.innerHTML = '<div><div class="sheet-title">Coleção</div><div class="sheet-sub">Lagoa ' + pondList().length + '/' + MAX_POND + ' · Viveiro ' + storageList().length + '</div></div>';
    const close = document.createElement('button');
    close.className = 'pill-btn';
    close.textContent = 'Fechar';
    close.addEventListener('click', closeSheet);
    header.appendChild(close);
    sheet.appendChild(header);

    const sorter = (a, b) => rarityRank(a.species) - rarityRank(b.species) || a.species.name.localeCompare(b.species.name);
    [['Na lagoa', pondList().sort(sorter)], ['No viveiro', storageList().sort(sorter)]].forEach((sec) => {
      const h = document.createElement('div');
      h.className = 'sheet-section';
      h.textContent = sec[0];
      sheet.appendChild(h);
      if (!sec[1].length) {
        const empty = document.createElement('div');
        empty.className = 'sheet-empty';
        empty.textContent = 'Nenhum sapo aqui.';
        sheet.appendChild(empty);
        return;
      }
      const grid = document.createElement('div');
      grid.className = 'sheet-grid';
      sec[1].forEach((f) => grid.appendChild(miniCard(f)));
      sheet.appendChild(grid);
    });
  }

  function showCard(frog) {
    document.querySelectorAll('.card-backdrop').forEach((n) => n.remove());
    const rk = rarityKey(frog.species);

    const backdrop = document.createElement('div');
    backdrop.className = 'card-backdrop';
    backdrop.addEventListener('click', (ev) => { if (ev.target === backdrop) backdrop.remove(); });

    const card = document.createElement('div');
    card.className = 'frog-card card-tier-' + rk;
    const inner = document.createElement('div');
    inner.className = 'frog-card-inner';

    const closeBtn = document.createElement('div');
    closeBtn.className = 'card-close';
    closeBtn.textContent = '✕';
    closeBtn.addEventListener('click', () => backdrop.remove());

    const topRow = document.createElement('div');
    topRow.className = 'card-top-row';
    const mergedTag = frog.count > 1 ? ' <span style="opacity:.6;font-weight:400;font-size:12px;">×' + frog.count + '</span>' : '';
    topRow.innerHTML = '<span class="card-name">' + frog.species.name + mergedTag + '</span>' +
      '<span class="card-rarity-badge badge-' + rk + '">' + frog.species.rarity + '</span>';

    const portrait = document.createElement('div');
    portrait.className = 'card-portrait glow-' + rk;
    const portraitGlow = document.createElement('div');
    portraitGlow.className = 'card-portrait-glow';
    portrait.appendChild(portraitGlow);
    portrait.appendChild(buildFrogRig(frog.species).svg);
    if (rk !== 'comum') {
      const shine = document.createElement('div');
      shine.className = 'card-shine';
      portrait.appendChild(shine);
    }

    const flavor = document.createElement('div');
    flavor.className = 'card-flavor';
    flavor.textContent = '"' + frog.species.flavor + '"';

    const statsWrap = document.createElement('div');
    statsWrap.className = 'card-stats';
    const statLabels = { agilidade: 'Agilidade', camuflagem: 'Camuflagem', charme: 'Charme' };
    Object.keys(statLabels).forEach((key) => {
      const row = document.createElement('div');
      row.className = 'stat-row';
      row.innerHTML = '<span class="stat-label">' + statLabels[key] + '</span>' +
        '<span class="stat-track"><span class="stat-fill" style="width:' + (frog.species.stats[key] * 10) + '%"></span></span>';
      statsWrap.appendChild(row);
    });

    const actions = document.createElement('div');
    actions.className = 'card-actions';
    const btn = document.createElement('button');
    btn.className = 'pill-btn card-action-btn';
    if (frog.location === 'pond') {
      btn.textContent = '🧺 Guardar no viveiro';
      btn.addEventListener('click', () => { sendToStorage(frog); backdrop.remove(); });
    } else {
      const full = pondList().length >= MAX_POND;
      btn.textContent = full ? 'Lagoa cheia (' + MAX_POND + '/' + MAX_POND + ')' : '🌊 Soltar na lagoa';
      btn.disabled = full;
      btn.addEventListener('click', () => { if (releaseToPond(frog)) backdrop.remove(); });
    }
    actions.appendChild(btn);

    inner.appendChild(topRow); inner.appendChild(portrait); inner.appendChild(flavor);
    inner.appendChild(statsWrap); inner.appendChild(actions);
    card.appendChild(inner); card.appendChild(closeBtn);
    backdrop.appendChild(card);
    document.body.appendChild(backdrop);
  }

  document.getElementById('btnStorage').addEventListener('click', openSheet);
  document.getElementById('btnCollect').addEventListener('click', collectNewFrog);
  const btnSpeed = document.getElementById('btnSpeed');
  btnSpeed.addEventListener('click', () => {
    const order = [1, 4, 8];
    SPEED = order[(order.indexOf(SPEED) + 1) % order.length];
    btnSpeed.textContent = 'Velocidade ' + SPEED + '×';
  });
  updateUI();

  /* ---------- Carpas: caminho + reflexo desfocado logo abaixo ---------- */
  const koiVariants = [
    { base: '#E65100', spot1: '#FFFFFF', spot2: '#1b1b1b' },
    { base: '#FF7043', spot1: '#1b1b1b', spot2: '#FFFFFF' },
  ];
  const koiPaths = [
    'M 20,60 C 80,20 160,100 240,50 C 300,15 340,70 360,100',
    'M 360,220 C 300,260 220,190 150,230 C 90,265 50,210 20,180',
  ];
  koiVariants.forEach((kv, i) => {
    const refl = document.createElement('div');
    refl.className = 'koi-reflection';
    refl.style.offsetPath = 'path("' + koiPaths[i] + '")';
    refl.style.animation = 'swimPath ' + (16 + i * 4) + 's linear infinite';
    refl.style.animationDelay = (i * 3) + 's';
    refl.style.offsetRotate = 'auto';
    refl.style.offsetDistance = '0%';
    refl.innerHTML = '<div style="width:100%;height:100%;border-radius:50%;background:radial-gradient(closest-side, rgba(255,255,255,0.15), transparent 75%);filter:blur(2px);"></div>';
    pond.appendChild(refl);

    const el = document.createElement('div');
    el.className = 'koi';
    el.innerHTML = koiSVG(kv.base, kv.spot1, kv.spot2);
    el.style.offsetPath = 'path("' + koiPaths[i] + '")';
    el.style.animationDuration = (16 + i * 4) + 's';
    el.style.animationDelay = (i * 3) + 's';
    el.style.offsetRotate = 'auto';
    pond.appendChild(el);
  });

  /* ---------- Vaga-lumes com profundidade variada ---------- */
  for (let i = 0; i < 9; i++) {
    const depth = Math.random();
    const size = 2.5 + depth * 3.5;
    const f = document.createElement('div');
    f.className = 'firefly';
    f.style.left = (Math.random() * 90 + 5) + '%';
    f.style.top = (Math.random() * 65 + 5) + '%';
    f.style.width = size + 'px';
    f.style.height = size + 'px';
    f.style.boxShadow = '0 0 ' + (4 + depth * 6) + 'px ' + (1 + depth * 2) + 'px var(--accent)';
    f.style.opacity = (0.5 + depth * 0.5).toString();
    const dur = (5 + Math.random() * 7).toFixed(1);
    const blinkDur = (1.3 + Math.random() * 2.2).toFixed(1);
    const dx = (Math.random() * 46 - 23).toFixed(0);
    const dy = (Math.random() * 46 - 23).toFixed(0);
    const kfName = 'ff' + i;
    const styleTag = document.createElement('style');
    styleTag.innerHTML = '@keyframes ' + kfName + ' { 0%,100% { transform: translate(0,0);} 50% { transform: translate(' + dx + 'px,' + dy + 'px);} }';
    document.head.appendChild(styleTag);
    f.style.animation = kfName + ' ' + dur + 's ease-in-out infinite, fireflyBlink ' + blinkDur + 's ease-in-out infinite';
    pond.appendChild(f);
  }

  /* ---------- Ondas ambiente ocasionais, independentes dos sapos ---------- */
  function spawnAmbientRipple() {
    const x = Math.random() * 80 + 10;
    const y = Math.random() * 60 + 15;
    const r = document.createElement('div');
    r.className = 'ambient-ripple';
    r.style.left = x + '%';
    r.style.top = y + '%';
    r.style.width = '6px';
    r.style.height = '6px';
    r.style.animationDuration = '4s';
    pond.appendChild(r);
    setTimeout(() => r.remove(), 4100);
    setTimeout(spawnAmbientRipple, 3000 + Math.random() * 4000);
  }
  setTimeout(spawnAmbientRipple, 1500);
})();
</script>
