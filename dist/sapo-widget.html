<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Widget Sapo do Dia</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: transparent;
      border-radius: 16px; /* Para cantos arredondados */
    }
    .widget-content {
      padding: 16px;
      background-color: #1F2937; /* Cor de fundo escura */
      color: #F3F4F6; /* Cor de texto clara */
      height: 100%;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    #task-title {
      font-size: 1rem;
      font-weight: 600;
      margin: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .placeholder {
      color: #9CA3AF; /* Cinza para o placeholder */
    }
  </style>
</head>
<body>
  <div class="widget-content">
    <p id="task-title" class="placeholder">Carregando sapo do dia...</p>
  </div>
  <script src="/sapo-widget.js" defer></script>
</body>
</html>
